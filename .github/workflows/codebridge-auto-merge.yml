# GENERATED by codebridge. This file is a STUB — it holds no logic.
#
# Classifies EVERY pull request and auto-merges only when:
#   1. every changed file is CRITERIA class, or GUARD class passing the ratchet
#   2. the project's verify command passes
#   3. the PR body carries the evidence packet
#
# One file outside those classes blocks the merge entirely. The classifier and
# the ratchet live in the kit, so fixing either reaches this project without
# this file changing.
#
# The `auto-upgrade` label is applied as OUTPUT when a PR qualifies. It is
# never required as INPUT — a mechanism that depends on someone remembering a
# label will be forgotten.
#
# HONEST LIMITATION: on a GitHub free plan for a private repo, branch
# protection and required status checks are unavailable. This workflow can
# classify, refuse and comment, but it cannot physically prevent a human from
# merging a BRUNO-class PR by hand.

name: "codebridge — auto-merge system upgrades"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  classify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ratchet compares against the base ref

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve codebridge kit
        env:
          KIT_URL: ${{ vars.CODEBRIDGE_KIT_URL }}
        run: |
          if [ -d codebridge-kit ]; then
            echo "CODEBRIDGE_HOME=$PWD/codebridge-kit" >> "$GITHUB_ENV"
          elif [ -n "$KIT_URL" ]; then
            git clone --depth 1 "$KIT_URL" /tmp/codebridge
            echo "CODEBRIDGE_HOME=/tmp/codebridge/codebridge-kit" >> "$GITHUB_ENV"
          else
            echo "::error::No codebridge kit available. Set the CODEBRIDGE_KIT_URL repository variable."
            exit 1
          fi

      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          FILES=$(gh pr diff "$PR" --name-only)
          echo "Changed files:"; echo "$FILES"

          set +e
          RESULT=$(echo "$FILES" | python3 "$CODEBRIDGE_HOME/lib/classify.py" --stdin --json)
          RC=$?
          set -e
          echo "$RESULT"

          # 0/1/2 are the three verdicts. Anything else is a crash, and a
          # crashed classifier must never read as "nothing to worry about".
          if [ "$RC" -gt 2 ]; then
            echo "::error::Classifier crashed (exit $RC)."
            exit 1
          fi

          PR_CLASS=$(echo "$RESULT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["pr_class"])')
          if [ -z "$PR_CLASS" ]; then
            echo "::error::Could not parse classifier output."
            exit 1
          fi
          echo "pr_class=$PR_CLASS" >> "$GITHUB_OUTPUT"

          if [ "$PR_CLASS" = "BRUNO" ]; then
            BREAKDOWN=$(echo "$RESULT" | python3 -c '
import sys, json
d = json.load(sys.stdin)
for path, cls in sorted(d["files"].items()):
    print(f"- **{cls}**: `{path}`")
')
            gh pr comment "$PR" --body "## Classifier verdict: BRUNO

This pull request contains files that require the owner's review. Auto-merge is not available.

$BREAKDOWN"
            echo "PR requires review. Stopping."
            exit 1
          fi

          gh pr edit "$PR" --add-label "auto-upgrade" || \
            echo "::warning::Could not apply the auto-upgrade label (cosmetic output only)."

      - name: Ratchet check (guard-class changes must be additive)
        if: steps.classify.outputs.pr_class == 'GUARD'
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          python3 "$CODEBRIDGE_HOME/lib/ratchet.py" "$BASE" HEAD

      - name: Validate PR evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 "$CODEBRIDGE_HOME/lib/ci_evidence.py"

      - name: Kit self-test
        run: bash "$CODEBRIDGE_HOME/tests/run-all.sh"

      - name: Project verification command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CMD=$(python3 "$CODEBRIDGE_HOME/lib/config.py" \
                | python3 -c 'import sys,json;print(json.load(sys.stdin)["verify_command"])')
          if [ -z "$CMD" ]; then
            echo "::warning::No verify_command configured in codebridge.yml — nothing was run."
            exit 0
          fi
          echo "Running: $CMD"
          bash -c "$CMD"

      - name: Auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_CLASS: ${{ steps.classify.outputs.pr_class }}
        run: |
          TITLE=$(gh pr view "$PR" --json title --jq .title)
          gh pr comment "$PR" --body "## Auto-merged by codebridge

**Class:** $PR_CLASS
**Reason:** every changed file is within the auto-upgrade criteria, the ratchet passed, evidence is present and verification is green.

System upgrades — rules, recipes, tools, alarms, docs, skills, subagents, tests — merge automatically. Irreversible business actions remain the owner's permanently."

          # --auto needs branch protection + allow_auto_merge, both unavailable
          # on a free private plan. Everything above has already been validated.
          gh pr merge "$PR" --squash --subject "auto-upgrade(${PR_CLASS}): $TITLE"
