# GENERATED by codebridge. This file is a STUB.
#
# It contains no logic. It fetches the kit and calls it, so a fix to the
# evidence rules reaches this project without this file changing. That is the
# whole point: the copy that must exist here is the copy that never needs
# updating.
#
# Kit resolution order:
#   1. codebridge-kit/ committed in this repository (the kit's own repo)
#   2. the CODEBRIDGE_KIT_URL repository variable, cloned at depth 1
# If neither is available the job FAILS. It never passes by default — a gate
# that green-ticks when it could not run is worse than no gate.

name: "codebridge — PR evidence gate"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Resolve codebridge kit
        env:
          KIT_URL: ${{ vars.CODEBRIDGE_KIT_URL }}
        run: |
          if [ -d codebridge-kit ]; then
            echo "CODEBRIDGE_HOME=$PWD/codebridge-kit" >> "$GITHUB_ENV"
            echo "Using kit committed in this repository."
          elif [ -n "$KIT_URL" ]; then
            git clone --depth 1 "$KIT_URL" /tmp/codebridge
            echo "CODEBRIDGE_HOME=/tmp/codebridge/codebridge-kit" >> "$GITHUB_ENV"
            echo "Cloned kit from CODEBRIDGE_KIT_URL."
          else
            echo "::error::No codebridge kit available. Set the CODEBRIDGE_KIT_URL repository variable."
            exit 1
          fi

      - name: Check PR body carries the evidence packet
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 "$CODEBRIDGE_HOME/lib/ci_evidence.py"
