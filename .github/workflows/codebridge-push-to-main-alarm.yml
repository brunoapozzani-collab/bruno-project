# GENERATED by codebridge.
#
# Fires on every push to the deploy branch and determines whether the push came
# from a merged pull request or was a direct push. A direct push FAILS the
# workflow, which emails the pusher and the repository owner.
#
# This is the only layer that cannot be silenced locally. The pre-push hook is
# bypassable with --no-verify; this is not bypassable from a developer machine.
# It does not revert the push — it makes it impossible for the push to be
# quiet.

name: "codebridge — 🚨 direct push to main"

on:
  push:
    branches: [main]

jobs:
  check-direct-push:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Was this push a pull request merge?
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking $COMMIT_SHA for an associated merged pull request..."

          if ! raw=$(gh api "repos/$REPO/commits/$COMMIT_SHA/pulls"); then
            echo "::error::Could not query the pulls API for this commit."
            echo "The alarm cannot confirm this push was a PR merge, so it does not pass."
            exit 1
          fi

          pr_count=$(echo "$raw" | python3 -c \
            'import sys,json;print(len([p for p in json.load(sys.stdin) if p.get("merged_at")]))')

          if [ "$pr_count" -gt 0 ]; then
            echo "✅ This push is a pull request merge ($pr_count merged PR(s))."
            exit 0
          fi

          echo ""
          echo "🚨 ALARM: direct push to main detected."
          echo ""
          echo "   Commit: $COMMIT_SHA"
          echo "   Pusher: ${{ github.actor }}"
          echo ""
          echo "   This commit was not produced by merging a pull request."
          echo "   The push is NOT reverted — the record simply shows it was irregular,"
          echo "   and the owner receives an email."
          exit 1
